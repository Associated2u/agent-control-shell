; Polybar module for agent-control-shell. `acs status --format polybar` emits the dot with
; %{F} colour tags already applied: grey hollow when idle, amber t1/t2, red shell.
[module/acs]
type = custom/script
exec = acs status --format polybar
interval = 1
click-left = x-terminal-emulator -e bash -c 'acs status; read -rp "enter to close "'
click-middle = acs end
